services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: caip2026-pgvector
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-anti_fraud_rag}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
      - ./app/db/pgvector_schema.sql:/docker-entrypoint-initdb.d/001_pgvector_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-anti_fraud_rag}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: .
      target: runtime
    container_name: caip2026-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_PATH: /app/runtime/anti_fraud.db
      ANTI_FRAUD_ADMIN_TOKEN: ${ANTI_FRAUD_ADMIN_TOKEN:-change-me}
      JWT_SECRET: ${JWT_SECRET:-anti-fraud-lab-secret-key-change-in-production-2024}
      RATE_LIMIT_RPM: ${RATE_LIMIT_RPM:-0}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
      CHAT_FLOW_ENGINE: ${CHAT_FLOW_ENGINE:-classic}
      CHAT_LLM_ENABLED: ${CHAT_LLM_ENABLED:-0}
      RAG_LLM_ENABLED: ${RAG_LLM_ENABLED:-0}
      RAG_RETRIEVAL_ENABLED: ${RAG_RETRIEVAL_ENABLED:-0}
      RAG_TOP_K: ${RAG_TOP_K:-5}
      RAG_LLM_TIMEOUT: ${RAG_LLM_TIMEOUT:-15}
      PGVECTOR_DSN: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-anti_fraud_rag}
      OLLAMA_BASE_URL: ${DOCKER_OLLAMA_BASE_URL:-http://host.docker.internal:11545}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3-lora}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - api_runtime:/app/runtime
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  rag-import:
    profiles: ["rag"]
    build:
      context: .
      target: runtime
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGVECTOR_DSN: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-anti_fraud_rag}
    command:
      [
        "python",
        "scripts/import_knowledge_chunks.py",
        "--dsn",
        "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-anti_fraud_rag}",
        "--reset",
      ]
    restart: "no"

  rag-download:
    profiles: ["rag"]
    build:
      context: .
      target: rag-tools
    environment:
      MODELSCOPE_BGE_M3_MODEL_ID: ${MODELSCOPE_BGE_M3_MODEL_ID:-BAAI/bge-m3}
      MODELSCOPE_BGE_M3_LOCAL_DIR: /models/bge-m3
    volumes:
      - modelscope_models:/models
      - modelscope_cache:/root/.cache/modelscope
    command:
      [
        "python",
        "scripts/download_modelscope_model.py",
        "--model-id",
        "${MODELSCOPE_BGE_M3_MODEL_ID:-BAAI/bge-m3}",
        "--local-dir",
        "/models/bge-m3",
      ]
    restart: "no"

  rag-embed:
    profiles: ["rag"]
    build:
      context: .
      target: rag-tools
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGVECTOR_DSN: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-anti_fraud_rag}
      MODELSCOPE_BGE_M3_MODEL_ID: ${MODELSCOPE_BGE_M3_MODEL_ID:-BAAI/bge-m3}
      MODELSCOPE_BGE_M3_LOCAL_DIR: /models/bge-m3
      BGE_M3_MODEL_NAME: /models/bge-m3
      BGE_M3_USE_FP16: ${BGE_M3_USE_FP16:-0}
    volumes:
      - modelscope_models:/models
      - modelscope_cache:/root/.cache/modelscope
    command: >
      sh -c "python scripts/download_modelscope_model.py
      --model-id ${MODELSCOPE_BGE_M3_MODEL_ID:-BAAI/bge-m3}
      --local-dir /models/bge-m3
      && python scripts/embed_knowledge_chunks.py
      --dsn postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-anti_fraud_rag}
      --model /models/bge-m3"
    restart: "no"

volumes:
  api_runtime:
  pgvector_data:
  modelscope_models:
  modelscope_cache:
